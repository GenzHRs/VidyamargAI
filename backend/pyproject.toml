[tool.poetry]
name = "vidyamarg-backend-v2"
version = "2.0.0"
description = "VidyaMarg AI Career Intelligence Operating System Backend v2"
authors = ["VidyaMarg Team"]
readme = "README.md"
packages = [
    { include = "app" },
    { include = "packages" },
    { include = "ai_os" },
    { include = "services" }
]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.28,<3"}
asyncpg = "^0.29.0"
pydantic = {extras = ["email"], version = "^2.6.4"}
pydantic-settings = "^2.2.1"
redis = {extras = ["hiredis"], version = "^5.0.3"}
qdrant-client = "^1.8.2"
celery = "^5.3.6"
apscheduler = "^3.10.4"
httpx = "^0.27.0"
orjson = "^3.9.15"
PyJWT = {extras = ["crypto"], version = ">=2.15.1,<3"}
bcrypt = "^4.1.2"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"
websockets = "^12.0"
python-dotenv = "^1.0.1"
opentelemetry-api = "^1.23.0"
opentelemetry-sdk = "^1.23.0"
opentelemetry-instrumentation-fastapi = "^0.44b0"
prometheus-client = "^0.20.0"
psycopg2-binary = "^2.9.9"
requests = "^2.31.0"
pypdf = "^4.0.0"
kubernetes = "^29.0.0"
slowapi = "^0.1.9"
sentry-sdk = {extras = ["fastapi"], version = "^2.0.0"}
prometheus-fastapi-instrumentator = ">=8.1.0,<9"
starlette = ">=1.3.1,<2"
python-magic = "^0.4.27"
langchain-core = "^0.2.0"
langchain-community = "^0.2.0"
langgraph = "^0.2.0"
pymupdf = "^1.24.0"
reportlab = ">=4.2.0,<6"
pillow = ">=10.4.0,<12"

minio = ">=7.2.0,<8"
groq = ">=0.5.0"
telethon = ">=1.36.0"
beautifulsoup4 = ">=4.12.0"
lxml = ">=5.2.0"
python-dateutil = ">=2.9.0"
apify-client = ">=1.7.0"
rq = ">=1.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
black = "^24.3.0"
ruff = "^0.3.4"
mypy = "^1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
