    "experience_separator": "\\s+(?:\\||\u2014|\u2013|at)\\s+",
    "date_year": "(?:19|20)\\d{2}",
    "date_month": "(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)",
    "date_current": "(?:Present|Current|Now|Ongoing)",
    "table_header": "^(?:Dates|Title & Company|Key Responsibilities & Quantified Impact|Degree / Credential|Institution|Status / Date)$",
    "skill_left_boundary": "(?<![\\w.\\-])",
