[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-resume-extract"
version = "3.1.0"
description = "Offline rule-based resume extraction with source preservation and measurable quality"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
resume-extract = "resume_extract.pipeline:main"
resume-understand = "resume_extract.understand_cli:main"

[tool.setuptools]
packages = ["resume_extract"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
resume_extract = ["config.yaml", "schema.json", "storage_schema.sql", "profile.schema.json", "understanding.schema.json"]
